name: Daily Competitive Intelligence Scan

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:  # allow manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (for context)
        uses: actions/checkout@v4

      - name: Trigger backend scan
        run: |
          curl -X POST "${{ secrets.BACKEND_URL }}/api/v1/scrape/trigger?all_urls=true" \
            -H "Content-Type: application/json" \
            --max-time 1200

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Daily CI scan failed. Check backend logs."
